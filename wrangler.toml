# Cloudflare Containers configuration for all three fleets (U1 step 6, KTD2).
#
# DEPLOYABLE. This file was written unbound — no route, no origin, no trigger —
# because the Worker entrypoint and both Container classes landed in later units
# and "binding a route now would publish an endpoint that 500s" was true when it
# was written. It is no longer true: `src/mcp/serve.ts` and `src/worker/serve.ts`
# bind sockets and answer, `src/mcp/router.ts` routes to the first and now wakes
# the second, and both Container classes are handed their configuration. What
# changed, and what each change replaced, is recorded at the bottom of this file
# rather than deleted with the reasoning it retired — a config that quietly drops
# the sentence explaining why something was absent teaches the next reader
# nothing about why it is now present.
#
# The deploy runbook — every command, in order, from a clean checkout, including
# teardown — is `docs/deploy.md`. This file is the configuration; that one is the
# procedure.
#
# Shape, per KTD2: Worker -> Durable Object -> Container. Containers are not an
# alternative to Workers, they are reached through one. The Worker named in
# `main` is a router; the containers do the work.
#
# Why Containers and not Workers or Hyperdrive (KTD2, settled):
#   - Hyperdrive caps at 25 configs per account, so a per-tenant connection
#     string design walls at tenant #26.
#   - Workers' 128 MB ceiling rules out in-process rerank and embedding batches.
#   - Containers run arbitrary images with per-10ms billing and scale-to-zero,
#     so the fleet keeps pooled TCP, prepared statements, a per-tenant
#     postgres.js connection LRU and `SET LOCAL` discipline, connecting straight
#     to Neon with no Hyperdrive slot consumed.
#
# Assumption 4 (raw outbound TCP from a deployed Container to Neon) is verified
# in Phase 0, not assumed here. The no-branch keeps this file: if raw TCP is
# blocked, the fallback is these same Containers with
# `@neondatabase/serverless` over WebSocket on 443 — a port Containers
# explicitly permit — whose Pool/Client preserve session and transaction
# semantics, so `SET LOCAL hnsw.ef_search`, prepared statements and the
# per-tenant LRU all survive. Only if WebSocket egress also fails does the
# branch fall to Workers plus the one-shot HTTP driver, and only then does this
# configuration change.

name = "brainz-fleet"

# The router Worker. It resolves the tenant from the authenticated bearer and
# hands the request to that tenant's container; its `scheduled` handler wakes the
# worker fleet on the trigger below.
main = "src/mcp/router.ts"

compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

# The public origin, and the reason there is one.
#
# U6's OAuth discovery documents embed absolute issuer URLs, and a connector
# binds to what it reads — so the origin has to exist before a connector is
# pointed at it, and it has to be stable. `workers.dev` is the zero-config option
# and no custom domain is registered yet, so this is `https://<name>.<account
# subdomain>.workers.dev` and `BRAINZ_PUBLIC_ORIGIN` is set to exactly that
# string. The two are one fact expressed twice: `src/fleet/env.ts` refuses an
# origin with a path or a trailing slash precisely because a mismatch between
# them surfaces days later as a client rejecting an issuer.
#
# Moving to a custom domain is therefore not a config-only change — it re-points
# every connector that bound to the old issuer. The `[[routes]]` stanza that does
# it is recorded at the bottom of this file.
workers_dev = true

[observability]
enabled = true

# ---------------------------------------------------------------------------
# DECISION 1 — Tenant-affinity routing.
#
# Container instances are addressed by a Durable Object id derived from the
# tenant id:
#
#   getContainer(env.MCP_FLEET, tenantId).fetch(request)   // idFromName(tenantId)
#
# This is a decision, not an implementation detail, which is why it is written
# down next to the configuration rather than left to whoever writes the router.
#
# The per-tenant connection LRU (~500 warm) is the entire reason the Container
# runtime was chosen over Workers, and it only pays off under affinity. Route by
# load instead and two things break at once: every instance opens its own
# connections to the same Neon compute — connection amplification across the
# fleet against a database sized for one tenant's traffic — while most calls
# land on an instance that has never seen this tenant and take a cold LRU miss.
# That lands directly on the warm-p99 promise this decision exists to defend.
#
# The cost of affinity is honest and accepted: a tenant's throughput is bounded
# by one instance, and an instance is a single point of failure for its tenant
# until it is replaced. Both are the right trade for a per-user brain, where
# per-tenant concurrency is small and cross-tenant blast radius is the property
# being bought.
#
# DECISION 2 — sleepAfter (scale-to-zero vs. wake cost).
#
# Scale-to-zero is the cost model: per-10ms billing means an idle brain should
# cost nothing, and R13's idle anchor assumes exactly that. But the wake cost is
# not absorbed by the platform — it lands on the first call an agent makes,
# which is a user waiting on `recall` in their client, and on a cold connection
# LRU behind it.
#
# Chosen values, set on the Container classes (`sleepAfter` is a property of the
# Container class from @cloudflare/containers, not a key in this file — U6 and
# U10 set it mechanically; it is recorded here because it is a cost/latency
# decision, not a code detail):
#
#   MCP fleet    sleepAfter = "15m"   (platform default is "10m")
#   worker fleet sleepAfter = "5m"
#
# The MCP fleet is interactive and its wake cost is paid by a user, so it buys a
# longer idle window than the default: an agent session is bursty, and a second
# question five minutes after the first should not pay a cold start plus a cold
# LRU. The worker fleet is batch, wakes on a schedule and has no one waiting, so
# it gives the idle time back. Revisit both against measured wake latency and
# real idle distribution during U13's bake — the numbers below are reasoned, not
# measured, and this comment is the record of which is which.
# ---------------------------------------------------------------------------

# --- MCP fleet -------------------------------------------------------------
[[containers]]
class_name = "McpFleet"
image = "./Dockerfile"

# `lite` (1/16 vCPU, 256 MiB) reinstates the ceiling KTD2 rejected Workers over.
# `standard-1` is the smallest predefined type with headroom for in-process
# rerank and embedding batches; `standard-4` (4 vCPU, 12 GiB) is the top of the
# predefined range if that proves tight at U11.
instance_type = "standard-1"

# Ceiling, not a target. Under tenant affinity this bounds concurrently *active*
# tenants, since idle instances sleep rather than occupy a slot. Raise it with
# beta signups; it exists so a runaway does not scale into a surprise invoice.
max_instances = 50

# --- Worker fleet ----------------------------------------------------------
# Same image, different entrypoint. Consolidation cycles run for minutes with
# embedding batches and belong on Containers regardless of how the MCP surface
# is served, so this fleet stays here even under the Assumption-4 no-branch.
[[containers]]
class_name = "WorkerFleet"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 20

# --- Web fleet -------------------------------------------------------------
#
# DECISION 4 — the web app answers on THIS origin, and why it is not hosted
# somewhere cheaper.
#
# A session cookie is scoped to an origin. `/authorize` renders consent for a
# logged-in user, which means reading the session the login page wrote — and a
# login page on another host writes a cookie this origin never receives. So the
# web app is not merely *also* deployed; it is deployed here because that is the
# only arrangement in which the consent screen has a session to read. Requests
# reach it by PATH (`src/mcp/edge.ts` enumerates them), not by tenant: its front
# door is `/signup`, which runs before any tenant exists.
#
# Same image, third entrypoint (`src/web/serve.ts`, set on the Container class in
# src/mcp/router.ts). `sleepAfter` matches the MCP fleet's 15m rather than
# inventing a third number: both are interactive, and that value encodes "a
# person is waiting on the wake".
#
# **One instance, addressed by one name** (`web-singleton` in `edge.ts`). Not
# because the app is stateful — sessions are rows in the identity database — but
# because `src/control/secret-file.ts` assumes a single writer and the web
# process is it: provisioning banks a new tenant's connection string through that
# store. Two instances are two divergent stores of the same tenants' credentials.
# The accepted ceiling is that every signup, login and dashboard render for the
# whole deployment is served by one container; at alpha volume the wake cost
# matters more than the throughput, and the fix when it stops being ample is the
# managed secret store, not a second instance.
#
# `max_instances` is therefore a runaway guard rather than the mechanism — the
# DO name is the mechanism, exactly as it is for the worker fleet's singleton. It
# is small because nothing should be addressing this class by any other name;
# a count above one in the dashboard means something is.
[[containers]]
class_name = "WebFleet"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 3

# ---------------------------------------------------------------------------
# Durable Object bindings. The DO is the addressing mechanism for Decision 1 —
# the id derived from the tenant id is a DO id, and the container instance
# follows the DO.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MCP_FLEET"
class_name = "McpFleet"

[[durable_objects.bindings]]
name = "WORKER_FLEET"
class_name = "WorkerFleet"

[[durable_objects.bindings]]
name = "WEB_FLEET"
class_name = "WebFleet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["McpFleet", "WorkerFleet"]

# A new class needs its own tag; `v1` is already applied to the deployed Worker
# and editing it in place would be rewriting history the platform has, not
# declaring a change. Appended rather than merged for the same reason.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["WebFleet"]

# ---------------------------------------------------------------------------
# DECISION 3 — the cron that wakes the worker fleet.
#
# A container class nobody addresses never boots. `WORKER_FLEET` was bound above
# and reached by nothing: the Worker's only handler routed to `MCP_FLEET`, so a
# deploy would have succeeded, the MCP surface would have served, and no
# consolidation cycle would ever have run. This trigger is the caller — it
# invokes `scheduled` in src/mcp/router.ts, which dials one named worker
# instance's readiness route and lets that process's own loop do the work.
#
# **Thirty minutes, and why not five.** The cron is not the schedule; it is the
# wake. `ALPHA_SCHEDULER` (src/worker/scheduler.ts) already decides which tenants
# are due, and its `minIntervalMs` is 30 minutes — so waking more often than that
# cannot make any tenant consolidate sooner. What it would do is cost: the worker
# fleet's `sleepAfter` is 5m, so any cron period at or under it holds an instance
# awake permanently and bills a batch fleet like an interactive one. At 30m the
# instance wakes, ticks, and sheds — and the price is latency the batch lane can
# absorb: a tenant that becomes due right after a wake waits up to half an hour,
# against a 24h ceiling.
#
# The container's own timer fires every `BRAINZ_WORKER_TICK_MS` (60s) once it is
# awake, so one wake is several ticks, not one.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/30 * * * *"]

# ---------------------------------------------------------------------------
# NO R2 BINDING, DELIBERATELY.
#
# An `[[r2_buckets]]` binding is a *Worker* capability: it hands `env.BUCKET` to
# code running in workerd. Nothing in this Worker touches object storage — the
# router resolves a tenant and forwards a request — and a binding cannot be
# forwarded into a container, which is where the object store actually lives.
# `src/control/object-store.ts` builds a `Bun.S3Client` against an S3-compatible
# endpoint with a scoped access key, over the container's ordinary internet
# egress (`enableInternet` defaults to true on the Container class). So a binding
# here would be configuration nothing reads, and the honest thing is to say why
# it is absent rather than to add one that looks like plumbing.
#
# The credentials that path needs are on none of the three fleets' env manifests
# either (src/mcp/router.ts), and for a reason worth checking before adding them:
# `createTenantObjectStore` has no production composition root. Every caller needs
# a prefix-scoped credential and the only `ScopedCredentialMinter` in `src/`
# refuses. When a real minter lands, the credential joins a manifest, this comment
# changes, and `test/fleet/router-env.test.ts` is the file that notices.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WHAT CHANGED, AND WHAT IT REPLACED.
#
# This block used to read "deliberately absent until the surrounding units
# land". Those units landed, so the absences are recorded here as decisions
# taken rather than deleted along with the reasoning that made them absences.
#
# * **Routes.** Was: "binding a route now would publish an endpoint that 500s",
#   with a commented custom-domain stanza. The entrypoints serve, so the origin
#   is bound — as `workers_dev` (see the top of this file), because no custom
#   domain is registered. The custom-domain stanza is still the migration path
#   and is still not a config-only change: every connector that completed OAuth
#   against the workers.dev issuer bound to it.
#
#     [[routes]]
#     pattern = "mcp.<a domain you own>"
#     custom_domain = true
#
# * **Triggers.** Was: "U10 owns the schedule itself", commented at `*/5`. U10
#   landed; the schedule is `ALPHA_SCHEDULER` inside the container. The cron is
#   now present at `*/30` and is a wake rather than a schedule — see DECISION 3
#   for why the two are not the same thing and why the tighter period costs
#   money without buying latency.
#
# * **Secrets.** Unchanged in principle and now specific. Nothing
#   credential-shaped belongs in this file; it is committed to a public repo.
#   Every value is set with `wrangler secret put` and forwarded into the
#   containers by name — the manifests are `MCP_FLEET_VARIABLES`,
#   `WORKER_FLEET_VARIABLES` and `WEB_FLEET_VARIABLES` in src/mcp/router.ts, and
#   `docs/deploy.md` lists every name in order. The identity database and the
#   billing credentials are on the last of those three and on no other, which is
#   the whole reason the manifests are written out by name rather than forwarded
#   wholesale. Note that per-tenant connection strings and bearer
#   grants travel as ONE secret (`BRAINZ_SECRETS_JSON`, materialised into a file
#   by the image's bootstrap), which is an alpha shape with a 5 KB ceiling on it
#   — the Dockerfile header states the limits and `docs/deploy.md` states the
#   arithmetic.
# ---------------------------------------------------------------------------
