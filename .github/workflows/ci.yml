# The PR-blocking tier (U1 approach steps 5 and 7).
#
# Everything in this job runs with **no secrets**, on purpose. A pull request
# from a fork gets exactly the same green as one from a branch, which is the
# only way an outside contributor can tell whether their change is good. That
# constraint is what keeps the deterministic half of the suite deterministic:
# zero model calls, no network egress, no live substrate.
#
# Deliberately NOT wired in here:
#   * `scripts/probes/**` — throwaway probes that need real credentials and are
#     run by hand while an assumption is being settled.
#   * `eval:canary` and `eval:live-parity` — both need a live provider and a
#     live tenant, so they ride `real-substrate.yml` behind
#     `BRAINZ_REAL_SUBSTRATE`. A tier that calls models cannot be a fork-PR gate.
#   * `test:roundtrip` — still declared and still deliberately failing; U17 owns
#     it. `scripts/not-yet.ts` prints what it always printed and exits 1, because
#     a stub that passes makes an unimplemented gate look green.
#
# Wired in as of U7: `eval:blocking` below, and the `conformance` job at the
# bottom of this file (which self-skips while the published delta records a
# blocker, rather than being red on every PR).
#   * anything needing a live Neon project — see `real-substrate.yml`.

name: CI

on:
  # `push` is limited to the default branch so a branch with an open PR does not
  # run the whole job twice for one commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blocking:
    name: typecheck · tests · ledger · secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Wired at U1 rather than discovered at U3. Nothing in the suite talks to
      # it yet; it is here so the unit that needs a real Postgres with pgvector
      # inherits a working, secret-free substrate instead of re-plumbing CI
      # under deadline. pg17 + pgvector matches the tenant substrate.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: brainz_test
          POSTGRES_USER: postgres
          # Trust auth, not a password. The container is reachable only from
          # this job, and a password here would put a credential-shaped string
          # in a public repo for no security gain at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The name U3's schema and migration tests read. Not a secret: it points
      # at the throwaway service container above.
      DATABASE_URL: postgres://postgres@localhost:5432/brainz_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans commits, not just the tip tree, so a
          # secret added and then removed on the same branch is still caught.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is generated from wrangler.toml and declares
      # the bindings every handler sees. Committed so a fresh clone typechecks
      # offline — but a committed generated file drifts silently: rename a
      # binding in the config, forget to regenerate, and the types keep
      # compiling while the runtime hands the handler an undefined namespace on
      # the request path. Regenerating and diffing is the only way to notice.
      - name: Worker types are in sync with wrangler.toml
        run: |
          bunx wrangler types
          if ! git diff --quiet -- worker-configuration.d.ts; then
            echo "::error::worker-configuration.d.ts is stale. Run 'bunx wrangler types' and commit the result."
            git diff --stat -- worker-configuration.d.ts
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      # Prints the count of known-but-unguarded hazards alongside the unit
      # tests. That number should go down and should never be zero by accident.
      - name: Tests
        run: bun test

      # R6's floors. Deterministic, zero model calls, and the command proves
      # both rather than claiming them: it runs the tier twice and compares a
      # digest over every per-query outcome, with `fetch` trapped for the
      # duration so an accidental live call is a violation rather than a
      # silently different score. Two of the eight floors report `deferred` on
      # the committed synthetic vectors; the command prints which, every run.
      - name: Accuracy floors (R6)
        run: bun run eval:blocking

      # R7 / R20: no unclassified capability, no passed revisit date. A
      # capability may be declined; it may not be forgotten.
      - name: Concepts ledger
        run: bun run ledger:check

      - name: Verify the pgvector service
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 'pgvector ' || extversion FROM pg_extension WHERE extname = 'vector'"

      # Secret scanning before any credential exists. The repo is public from
      # commit one and the working tree references credentials that unlock a
      # real mailbox — a committed `.env` is instantly public and effectively
      # unrevocable. This is a control; `.gitignore` and discipline are not.
      #
      # The CLI is used rather than the vendor action because the action needs a
      # licence secret for organisation-owned repos, and a job that depends on a
      # secret cannot run on a fork PR. `--redact` keeps any finding's value out
      # of a public build log.
      - name: Scan for committed secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --exit-code 1

  # ---------------------------------------------------------------------------
  # Wire conformance (U7 approach step 5).
  # ---------------------------------------------------------------------------
  #
  # A separate job because it fetches and builds a *different project* — gbrain,
  # at the commit pinned in `upstream/gbrain.pin` — and the blocking job above
  # should stay a fast, self-contained check of this repository.
  #
  # THE SELF-SKIP IS THE POINT, AND IT IS NOT A SOFTENED GATE.
  # `upstream/memory-verbs-v1-partial.json` carries a `status`. While it reads
  # `blocked`, no run has ever observed the delta — today because the pinned
  # runner's MCP SDK caps at an older protocol version than this server
  # advertises, so its client aborts the handshake before a single case is
  # graded. Running the command anyway would be red on every PR, and a gate that
  # is red on every PR is a gate everyone learns to ignore. So the preflight
  # reads the published status and, while blocked, records a warning instead.
  #
  # The command itself never softens: `bun run conformance` exits non-zero the
  # entire time, and `evals/conformance/delta.ts` refuses to certify against a
  # blocked delta before it looks at any report. The moment somebody flips that
  # file to `observed`, this job starts enforcing with no edit here — which is
  # the same shape `evals/gates.ts` uses for a deferred floor.
  conformance:
    name: wire conformance (memory-verbs-v1-partial)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: brainz_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/brainz_test
      BRAINZ_GBRAIN_CACHE: ${{ github.workspace }}/../gbrain-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reads the published delta rather than deciding here, so the workflow and
      # the command can never disagree about whether a verdict exists.
      - name: Is a conformance verdict available?
        id: delta
        run: |
          set -euo pipefail
          status=$(bun --print 'JSON.parse(require("fs").readFileSync("upstream/memory-verbs-v1-partial.json","utf8")).status')
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      # Keyed on the pin, so advancing `upstream/gbrain.pin` fetches a fresh
      # tree instead of certifying against a stale one.
      - name: Cache the pinned gbrain checkout
        if: steps.delta.outputs.status == 'observed'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../gbrain-cache
          key: gbrain-${{ hashFiles('upstream/gbrain.pin') }}

      - name: Certify against the published delta
        if: steps.delta.outputs.status == 'observed'
        run: bun run conformance

      - name: Report that no verdict was available
        if: steps.delta.outputs.status != 'observed'
        run: |
          set -euo pipefail
          echo "::warning title=Wire conformance not certified::upstream/memory-verbs-v1-partial.json records a blocker rather than an observed run, so nothing was certified against gbrain's runner."
          {
            echo "### Wire conformance: not certified"
            echo
            echo "\`upstream/memory-verbs-v1-partial.json\` has \`status\` other than"
            echo "\`observed\`, so this commit has **no wire-conformance evidence**. The"
            echo "blocker is recorded in that file; \`bun run conformance --probe\` shows"
            echo "what the delta would be, and never exits 0."
          } >> "$GITHUB_STEP_SUMMARY"
