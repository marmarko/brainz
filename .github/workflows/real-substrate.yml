# The scheduled, secret-gated tier. NEVER runs on `pull_request`.
#
# ---------------------------------------------------------------------------
# Why this workflow exists at all
# ---------------------------------------------------------------------------
# The hazard ledger's "dev engine masks remote engine" card. In the reference
# implementation, a local stand-in engine accepted a query shape the real remote
# engine rejected, so the bug was invisible in development and in CI and only
# appeared against the real substrate — where it aborted every sync. A test
# suite that only ever runs against a convenient local engine does not merely
# miss that class of bug; it actively produces confidence that the class does
# not exist.
#
# So a second tier is structural, not optional. `ci.yml` proves the code is
# correct against a dockerized Postgres with no secrets, which is what lets fork
# PRs run it. This workflow proves the same code is correct against a real Neon
# project — where connection pooling, per-connection GUCs, extension
# availability and provisioning latency behave differently from a container on
# the same host.
#
# It never runs on `pull_request`, because a PR-triggered job with access to
# secrets is a credential-exfiltration path from any fork.
#
# ---------------------------------------------------------------------------
# What it owns today (U7)
# ---------------------------------------------------------------------------
#   * `eval:live-parity` — the only coverage the two read-path model stages have
#     anywhere in the two-tier design. The blocking tier's determinism comes from
#     committed embeddings and cross-encoder scores, so it grades the CONSUMERS
#     of those numbers and never the invocations: a swapped asymmetric prefix, a
#     changed `dimensions` value, or a client-side truncation that skips
#     re-normalisation all score identically there while real recall degrades.
#     This job re-invokes both through the production `src/ai/` path and fails on
#     divergence beyond a committed tolerance.
#   * `eval:canary` — the nightly model-judged tier, routed as the `judge` op so
#     the judge is never the family that produced the output being judged.
#
# Both commands FAIL CLOSED: no provider vectors to compare, or no gradeable
# check, is a non-zero exit rather than a green tick for having measured
# nothing. The steps below decide whether it is worth invoking them, which is
# the same split the credential gate above already uses.
#
# ---------------------------------------------------------------------------
# What it will own (U2/U3; not written yet)
# ---------------------------------------------------------------------------
#   * Real-Neon provisioning end to end: create project, role, database, apply
#     the tenant schema, verify a first query, tear down.
#   * The H1 behavioural guard against a live project — >200 matching chunks,
#     a 250-candidate request, >=200 returned. `hnsw.ef_search` defaults to 40
#     and silently truncates the candidate pool; the failure presents as "our
#     ranking is mediocre", never as an error.
#   * The pooled-connection `SET LOCAL` test — two sequential queries on one
#     pooled connection, the second seeing the default. A per-connection GUC
#     that evaporates is a cross-tenant correctness bug with no local analogue.
#
# ---------------------------------------------------------------------------
# The registration contract
# ---------------------------------------------------------------------------
# A real-substrate test gates itself on `BRAINZ_REAL_SUBSTRATE`, which only this
# workflow sets:
#
#     const live = !!process.env.BRAINZ_REAL_SUBSTRATE;
#     test.skipIf(!live)("H1: ef_search is set per transaction", async () => { ... });
#
# That keeps `bun test` honest in both directions — the blocking tier reports
# the test as skipped rather than passing it by omission, and this workflow runs
# the identical file with the credential present. The step below greps for that
# marker so an empty suite reports itself instead of returning a green tick for
# having done nothing.

name: Real substrate

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour to avoid the top-of-hour scheduling queue.
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  real-substrate:
    name: live Neon project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The `secrets` context is not available in a job-level `if`, so the gate
      # is a step that maps the secret into `env` and publishes a boolean.
      # A missing credential is a warning, not a failure: this workflow is
      # cloned into forks that will never have one, and a scheduled job that
      # fails by design trains people to ignore its notifications.
      - name: Check for the credentials this tier needs
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${NEON_API_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Neon credential present." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Real-substrate tier not run::NEON_API_KEY is not configured for this repository, so nothing was verified against a live project."
            {
              echo "### Real substrate: not run"
              echo
              echo "\`NEON_API_KEY\` is not configured. Nothing was verified against a live"
              echo "Neon project — the dockerized tier in \`ci.yml\` is the only evidence"
              echo "this commit has."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Look for registered real-substrate tests
        id: suite
        run: |
          set -euo pipefail
          count=0
          if [ -d test ]; then
            count=$(grep -rl 'BRAINZ_REAL_SUBSTRATE' test | wc -l | tr -d ' ')
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the real-substrate suite
        if: steps.gate.outputs.ready == 'true' && steps.suite.outputs.registered == 'true'
        env:
          BRAINZ_REAL_SUBSTRATE: "1"
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bun test

      # Loud, not silent. A skeleton that returns a green tick for having run
      # nothing is the same failure shape this whole workflow exists to catch.
      - name: Report that no real-substrate tests are registered
        if: steps.suite.outputs.registered != 'true'
        run: |
          set -euo pipefail
          echo "::notice title=No real-substrate tests registered yet::Nothing in test/ gates on BRAINZ_REAL_SUBSTRATE, so this run verified nothing against a live project."
          {
            echo "### No real-substrate tests registered yet"
            echo
            echo "Nothing under \`test/\` gates on \`BRAINZ_REAL_SUBSTRATE\`, so this run"
            echo "exercised no live substrate. The workflow is a working skeleton waiting"
            echo "for U2 (real-Neon provisioning) and U3 (the H1 behavioural guard and the"
            echo "pooled-connection \`SET LOCAL\` test)."
            echo
            echo "Until those land, **the dev-engine-masks-remote-engine hazard is"
            echo "unguarded** — see \`docs/porting-hazards.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report that registered tests could not run
        if: steps.gate.outputs.ready != 'true' && steps.suite.outputs.registered == 'true'
        env:
          # Through `env` rather than interpolated into the shell — the habit
          # matters more than this particular value, which is a count we
          # produced ourselves.
          REGISTERED_FILES: ${{ steps.suite.outputs.count }}
        run: |
          set -euo pipefail
          echo "::warning title=Real-substrate tests skipped::${REGISTERED_FILES} file(s) gate on BRAINZ_REAL_SUBSTRATE but no credential was available to run them."

      # ---------------------------------------------------------------------
      # U7's scheduled tiers.
      # ---------------------------------------------------------------------

      # Gap #16: the blocking tier cannot see a live embedding or rerank call by
      # construction. This is where those two stages get looked at. It needs a
      # provider credential as well as the substrate flag — with neither, the
      # command would refuse, which is correct but not worth a red notification
      # every night.
      # Same split as the credential gate: ask before invoking. The manifest
      # carries zero provider-sourced vectors today, so the command would refuse
      # — correctly, and every single night, which is how a scheduled red stops
      # being read. The command's own refusal is unchanged; this step decides
      # whether the question is worth asking.
      - name: Is anything committed to compare against?
        id: parity
        run: |
          set -euo pipefail
          # `--silent` so bun's own "$ bun run ..." banner can never land in
          # GITHUB_OUTPUT, where a line that is not key=value fails the step.
          bun run --silent eval:live-parity --preflight | tee -a "$GITHUB_OUTPUT"

      - name: Live-model parity
        if: steps.gate.outputs.ready == 'true' && steps.parity.outputs.samples != '0'
        env:
          BRAINZ_REAL_SUBSTRATE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bun run eval:live-parity

      # Preflight first, for the reason the credential gate exists: while every
      # canary check is deferred (its producing op has no committed model-id
      # pin), invoking the tier would produce a nightly failure by design, and a
      # scheduled job that fails by design trains people to ignore it. The
      # command still refuses on its own; this step decides whether to ask.
      - name: Is anything gradeable on the canary?
        id: canary
        run: |
          set -euo pipefail
          bun run --silent eval:canary --preflight | tee -a "$GITHUB_OUTPUT"

      - name: Judged quality (canary tenant)
        # Non-blocking by contract — "nightly, non-blocking" in the Verification
        # Contract — so a quality trend never gates a merge, but it is still run
        # and still reported.
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true' && steps.canary.outputs.gradeable != '0'
        env:
          BRAINZ_REAL_SUBSTRATE: "1"
          BRAINZ_CANARY_TENANT: ${{ secrets.BRAINZ_CANARY_TENANT }}
        run: bun run eval:canary

      - name: Report that live parity had nothing to compare
        if: steps.parity.outputs.samples == '0'
        run: |
          set -euo pipefail
          echo "::notice title=Live parity had nothing to compare::The committed manifest carries no provider-sourced vectors, so the two read-path model stages have no live coverage."
          {
            echo "### Live-model parity: nothing to compare"
            echo
            echo "\`evals/fixtures/embeddings.manifest.jsonl\` carries only synthetic vectors,"
            echo "so re-embedding would compare an encoder against a hash function. Until a"
            echo "provider-sourced manifest is committed, **the embedding and rerank stages"
            echo "have no live coverage anywhere in the two-tier design** — see Gap #16."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report that the canary had nothing to grade
        if: steps.canary.outputs.gradeable == '0'
        run: |
          set -euo pipefail
          echo "::notice title=Canary tier had nothing to grade::Every canary check is deferred — no producing op carries a committed model-id pin yet."
          {
            echo "### Canary tier: nothing gradeable"
            echo
            echo "Every check in \`evals/canary.ts\` is waiting on the unit that ships its"
            echo "producing op (U11 for extraction, U12 for briefing). The deferral is"
            echo "derived from \`evals/receipts/model-ids.json\`, so it clears itself the"
            echo "day a receipt pins one of those ops — nothing here has to be remembered."
          } >> "$GITHUB_STEP_SUMMARY"
